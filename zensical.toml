[project]
site_url = "https://constitutivetemplates.github.io/daimonion-example"
site_name = "daimonion-example"
site_description = "An expanded https://github.com/ConstitutiveTemplates/daimonion to illustrate how it looks with all the options enabled."
site_author = "kashi-x"

repo_url = "https://github.com/ConstitutiveTemplates/daimonion-example"
repo_name = "ConstitutiveTemplates/daimonion-example"
edit_uri = "edit/main/docs/"

copyright = 'Maintained by <a href="https://github.com/ConstitutiveTemplates/daimonion-example">kashi-x</a>.'

nav = [
  { "Home" = "index.md" },
  { "Modules" = "modules.md" },
]

[project.theme]
name = "material"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins]
mkdocstrings = { default_handler = "python", handlers = { python = { paths = ["src"] } } }
search = {}

[project.markdown_extensions]
admonition = {}
toc = { permalink = true }
pymdownx.superfences = {}
